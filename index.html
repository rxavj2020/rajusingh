<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Visiting Card</title>
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated Background Elements removed for pure white background -->

    <!-- Main Card Container -->
    <main class="card-container">
        <div class="glass-card">

            <!-- Profile Section -->
            <header class="profile-header">
                <div class="profile-img-wrapper">
                    <!-- Replace src with your actual image path or URL -->
                    <img src="raju.jpeg" alt="Profile Picture" class="profile-img">
                </div>
                <h1 class="name">Raju Singh</h1>
                <p class="designation">Insurance Advisor, LIC</p>
            </header>

            <!-- Info Section -->
            <section class="info-section">
                <div class="info-item">
                    <div class="icon-box"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="info-text">
                        <span class="label">Address</span>
                        <span class="value">Barar, Rajasthan, India</span>
                    </div>
                </div>
            </section>

            <!-- Social Links Section -->
            <section class="social-section">
                <p class="social-title">Follow Me</p>
                <div class="social-grid">
                    <a href="https://www.facebook.com/share/17FYBT3WLV/" target="_blank" class="social-btn facebook"
                        aria-label="Facebook">
                        <i class="fa-brands fa-facebook-f"></i>
                        <span>Facebook</span>
                    </a>
                    <a href="https://instagram.com/rajusingh7610" target="_blank" class="social-btn instagram"
                        aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                        <span>Instagram</span>
                    </a>
                </div>
            </section>

            <!-- Primary CTA Section -->
            <section class="cta-section">
                <a href="https://wa.me/916377436367?text=Hello" target="_blank" class="btn btn-whatsapp glowing"
                    aria-label="Connect on WhatsApp">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span>Connect on WhatsApp</span>
                </a>
            </section>

            <!-- Footer -->
            <footer class="card-footer">
                <a href="https://vcard.link/card/IRhX.vcf" target="_blank" class="btn-save-contact">
                    <i class="fa-solid fa-address-card"></i> Save Contact
                </a>
            </footer>

        </div>
    </main>
</body>

</html>
